[build]
  publish = "."
  functions = "netlify/functions"

# Route API requests to serverless Netlify Functions (PayU Backend)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# External Meeting Reverse Proxy
[[redirects]]
  from = "/meeting/*"
  to = "https://grand-kheer-8d6b0e.netlify.app/meeting/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/meeting"
  to = "https://grand-kheer-8d6b0e.netlify.app/meeting/"
  status = 200
  force = true

# Sub-Project Clean Rewrites
[[redirects]]
  from = "/service/style.css"
  to = "/service-meet/style.css"
  status = 200
  force = true

[[redirects]]
  from = "/service/*"
  to = "/service-meet/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/service"
  to = "/service-meet/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/wa.vc/*"
  to = "/wa-vc/:splat"
  status = 200

[[redirects]]
  from = "/wa.vc"
  to = "/wa-vc/"
  status = 301

# Clean URLs
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms-and-conditions.html"
  status = 200

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 200

[[redirects]]
  from = "/shipping-return-policy"
  to = "/shipping-return-policy.html"
  status = 200

[[redirects]]
  from = "/refund-cancellation-policy"
  to = "/refund-cancellation-policy.html"
  status = 200

[[redirects]]
  from = "/payment-status"
  to = "/payment-status.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
