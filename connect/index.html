<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0112" />
    <title>CONNECT - Live Video &amp; Voice Connection</title>
    <link rel="icon" type="image/png" href="./assets/images/heart-logo-transparent.png" />
    
    <!-- Google Fonts: Poppins & Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Fallback: If raw template is reached directly in production on main domain, forward to compiled app
      if (typeof window !== 'undefined' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        if (!window.location.pathname.includes('/connect/dist') && !window.location.hostname.startsWith('connect.')) {
          window.location.replace('/connect/dist/' + window.location.search + window.location.hash);
        }
      }
    </script>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
