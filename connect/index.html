<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONNECT</title><style>html,body{margin:0;min-height:100%;background:#100014;font-family:Arial,sans-serif}.phone{position:relative;width:min(100vw,941px);margin:auto;min-height:100vh;background:#100014}.reference{display:block;width:100%;height:auto}.tap{position:absolute;border:0;background:transparent;cursor:pointer}.login{left:8%;top:42%;width:42%;height:5%}.signup{right:8%;top:42%;width:42%;height:5%}.guest{left:8%;top:78%;width:84%;height:5%}@media(min-width:942px){.phone{box-shadow:0 0 70px #e82eb677}}</style></head><body><main class="phone"><img class="reference" src="/connect/connect-hero-reference.png" alt="CONNECT login"><button class="tap login" aria-label="Log In"></button><button class="tap signup" aria-label="Sign Up"></button><button class="tap guest" aria-label="Continue as Guest"></button></main><script>document.querySelectorAll('.tap').forEach(b=>b.onclick=()=>alert('Demo login screen. Home navigation will be connected next.'));</script></body></html>
