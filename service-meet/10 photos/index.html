<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your 10 Exclusive Photos | Sanskruti Services</title>
  <link rel="icon" href="/Qr.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #20052b 0%, #0a050e 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 1.5rem 1rem 4rem;
    }
    .container { max-width: 900px; margin: 0 auto; text-align: center; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: #bfa8cc; font-size: 0.95rem; margin-bottom: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 3rem;
    }
    .card {
      background: rgba(22, 11, 31, 0.8);
      border: 1px solid rgba(255, 42, 116, 0.3);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .img-wrap {
      width: 100%;
      height: 280px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .img-wrap img:hover { transform: scale(1.05); }
    .card-footer { padding: 0.85rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .title { font-weight: 700; font-size: 0.95rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      background: linear-gradient(135deg, #ff2a74, #8a2be2);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 4px 15px rgba(255, 42, 116, 0.4);
    }
    .btn:hover { transform: translateY(-2px); }
    .wa-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25d366;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">✓ Access Unlocked</div>
    <h1>Your 10 Exclusive Photos</h1>
    <p>Thank you for your payment! Here are your 10 high-definition unlocked exclusive photos.</p>

    <div class="grid" id="mediaGrid"></div>

    <div class="wa-box">
      <h3>Need Help or Want More Custom Photos?</h3>
      <p style="margin-bottom: 0.5rem;">Connect with Sanskruti directly on WhatsApp for custom requests and direct video call bookings.</p>
      <a href="https://wa.me/919238861171?text=Hello%20Sanskruti,%20I%20have%20received%20my%2010%20photos%20package!" target="_blank" class="btn-wa">
        💬 Connect on WhatsApp
      </a>
    </div>
  </div>

  <script>
    const grid = document.getElementById('mediaGrid');
    const photoFiles = [
      'IMG (62).jpg',
      'IMG (70).jpg',
      'IMG (86).jpg',
      'IMG (117).jpg',
      'IMG (125).jpg',
      'IMG (126).jpg',
      'IMG (127).jpg',
      'IMG (135).jpg',
      'IMG (166).jpg',
      'IMG (205).jpg'
    ];

    photoFiles.forEach((file, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-wrap">
          <img src="${encodeURI(file)}" alt="Exclusive Photo #${index + 1}" loading="lazy">
        </div>
        <div class="card-footer">
          <div class="title">Exclusive Photo #${index + 1}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
