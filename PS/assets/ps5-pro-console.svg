<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="proWhiteFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="proDarkCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="proBlueLED" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0070d1"/>
    </linearGradient>
    <filter id="proSoftDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="280" cy="405" rx="220" ry="18" fill="#0f172a" opacity="0.08"/>
  <ellipse cx="280" cy="405" rx="140" ry="10" fill="#0f172a" opacity="0.12"/>

  <!-- ==================== PS5 PRO CONSOLE ==================== -->
  <g transform="translate(100, 20)" filter="url(#proSoftDrop)">
    <!-- Stand Base -->
    <ellipse cx="120" cy="375" rx="72" ry="10" fill="#e2e8f0" stroke="#0070d1" stroke-width="1.5"/>
    <circle cx="120" cy="375" r="28" fill="#cbd5e1"/>

    <!-- Left White Plate -->
    <path d="M 62 25 Q 48 180 68 360 L 104 360 Q 78 190 98 25 Z" 
          fill="url(#proWhiteFin)" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- PS5 PRO TRIPLE BLACK RACING AIR-INTAKE RIBS (LEFT) -->
    <g fill="#0f172a">
      <path d="M 68 170 L 101 170 L 100 176 L 69 176 Z" />
      <path d="M 70 184 L 100 184 L 99 190 L 71 190 Z" />
      <path d="M 72 198 L 99 198 L 98 204 L 73 204 Z" />
    </g>

    <!-- Glossy Obsidian Center -->
    <path d="M 98 25 Q 78 190 104 360 L 148 360 Q 158 190 142 25 Z" 
          fill="url(#proDarkCore)"/>

    <!-- Pro Electric Cobalt Blue LED Indicator Strip -->
    <path d="M 99 30 Q 80 190 105 354" stroke="url(#proBlueLED)" stroke-width="3" fill="none"/>
    <path d="M 141 30 Q 155 190 146 354" stroke="url(#proBlueLED)" stroke-width="3" fill="none"/>

    <!-- Front USB-C Dual Ports & Status LED -->
    <line x1="123" y1="285" x2="123" y2="297" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="123" y1="307" x2="123" y2="319" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="123" cy="334" r="2.5" fill="#38bdf8"/>

    <!-- Right White Plate -->
    <path d="M 142 25 Q 158 190 148 360 L 190 360 Q 206 270 200 190 Q 178 140 168 25 Z" 
          fill="url(#proWhiteFin)" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- PS5 PRO TRIPLE BLACK RACING AIR-INTAKE RIBS (RIGHT) -->
    <g fill="#0f172a">
      <path d="M 146 170 L 194 170 L 195 176 L 147 176 Z" />
      <path d="M 145 184 L 196 184 L 197 190 L 146 190 Z" />
      <path d="M 144 198 L 198 198 L 199 204 L 145 204 Z" />
    </g>

    <!-- PRO Badge (Discrete & Premium) -->
    <g transform="translate(68, 45)">
      <rect width="24" height="12" rx="2" fill="#0070d1"/>
      <text x="4" y="9" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="900">PRO</text>
    </g>
  </g>

  <!-- ==================== DUALSENSE EDGE PRO CONTROLLER ==================== -->
  <g transform="translate(260, 180)" filter="url(#proSoftDrop)">
    <!-- Controller White Shell -->
    <path d="M 35 140 C 22 90 40 50 72 35 C 92 25 112 32 116 35 C 120 32 140 25 160 35 C 192 50 210 90 197 140 C 188 175 168 190 160 165 C 152 140 148 118 144 110 C 132 116 100 116 88 110 C 84 118 80 140 72 165 C 64 190 44 175 35 140 Z" 
          fill="url(#proWhiteFin)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- DualSense Edge Signature All-Black Center -->
    <path d="M 68 106 C 78 114 98 118 116 118 C 134 118 154 114 164 106 C 158 145 150 164 140 164 C 130 164 125 148 116 148 C 107 148 102 164 92 164 C 82 164 74 145 68 106 Z" 
          fill="url(#proDarkCore)"/>

    <!-- Touchpad with Dual Lightbars -->
    <path d="M 80 37 L 152 37 L 145 85 L 87 85 Z" fill="#020617"/>
    <path d="M 78 35 L 154 35" stroke="url(#proBlueLED)" stroke-width="2.5"/>
    <path d="M 78 35 L 85 86" stroke="url(#proBlueLED)" stroke-width="1.5"/>
    <path d="M 154 35 L 147 86" stroke="url(#proBlueLED)" stroke-width="1.5"/>

    <!-- Fn function levers -->
    <rect x="88" y="136" width="9" height="3" rx="1" fill="#00d2ff"/>
    <rect x="135" y="136" width="9" height="3" rx="1" fill="#00d2ff"/>

    <!-- D-Pad -->
    <g transform="translate(56, 56)" fill="#0f172a">
      <rect x="8" y="0" width="6" height="22" rx="1.5"/>
      <rect x="0" y="8" width="22" height="6" rx="1.5"/>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(154, 56)">
      <circle cx="11" cy="3" r="4.5" fill="#0f172a"/>
      <polygon points="11,1 9.5,4.5 12.5,4.5" fill="none" stroke="#22c55e" stroke-width="1.2"/>
      <circle cx="19" cy="11" r="4.5" fill="#0f172a"/>
      <circle cx="19" cy="11" r="2" fill="none" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="11" cy="19" r="4.5" fill="#0f172a"/>
      <line x1="9.5" y1="17.5" x2="12.5" y2="20.5" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="12.5" y1="17.5" x2="9.5" y2="20.5" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="3" cy="11" r="4.5" fill="#0f172a"/>
      <rect x="1.5" y="9.5" width="3" height="3" fill="none" stroke="#e879f9" stroke-width="1.2"/>
    </g>

    <!-- Replaceable Stick Modules -->
    <circle cx="92" cy="116" r="16" fill="#020617" stroke="#00d2ff" stroke-width="1.5"/>
    <circle cx="92" cy="116" r="10" fill="#1e293b"/>
    <circle cx="140" cy="116" r="16" fill="#020617" stroke="#00d2ff" stroke-width="1.5"/>
    <circle cx="140" cy="116" r="10" fill="#1e293b"/>
  </g>
</svg>
