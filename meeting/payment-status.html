<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/meeting/favicon.svg" />
  <meta name="theme-color" content="#060913" />

  <title>Meeting Booking Status — NearMe</title>
  <meta name="description" content="View your NearMe meeting booking status, PayU payment confirmation, and direct WhatsApp contact details." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #060913;
      --card-bg: rgba(18, 24, 40, 0.94);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #f59e0b;
      --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      --emerald-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --rose-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      --amber-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 58, 237, 0.22), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(245, 158, 11, 0.15), transparent 70%),
        radial-gradient(circle at 10% 40%, rgba(16, 185, 129, 0.08), transparent 40%);
      color: #ffffff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header-bar {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.825rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateX(-2px);
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      position: relative;
    }

    .status-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      animation: slideUp 0.35s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Ambient Glow */
    .status-card::before {
      content: '';
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .card-success::before {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, transparent 70%);
    }

    .card-cancelled::before {
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, transparent 70%);
    }

    .card-failed::before {
      background: radial-gradient(circle, rgba(244, 63, 94, 0.35) 0%, transparent 70%);
    }

    .card-pending::before {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, transparent 70%);
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    /* Status Icon */
    .status-icon-wrap {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
    }

    .icon-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .icon-cancelled {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }

    .icon-failed {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.3);
    }

    .icon-pending {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .badge-cancelled {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .badge-failed {
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }

    .badge-pending {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }

    .status-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.75rem;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 0.65rem;
      letter-spacing: -0.02em;
    }

    .status-desc {
      color: #94a3b8;
      font-size: 0.925rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }

    /* Details Grid */
    .details-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 1.25rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
    }

    .detail-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-row:first-child {
      padding-top: 0;
    }

    .detail-label {
      color: #64748b;
      font-weight: 500;
    }

    .detail-val {
      color: #f1f5f9;
      font-weight: 700;
      text-align: right;
      max-width: 60%;
      word-break: break-all;
    }

    .val-highlight {
      color: #f59e0b;
      font-weight: 800;
    }

    /* Buttons */
    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn-main {
      width: 100%;
      padding: 0.95rem 1.25rem;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--font-display);
    }

    .btn-whatsapp {
      background: var(--emerald-gradient);
      color: #ffffff;
      border: 1px solid rgba(52, 211, 153, 0.5);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
    }

    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(16, 185, 129, 0.5);
      filter: brightness(1.08);
    }

    .btn-amber {
      background: var(--primary-gradient);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.35);
    }

    .btn-amber:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(245, 158, 11, 0.5);
      filter: brightness(1.08);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-link {
      background: none;
      border: none;
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      padding: 0.4rem;
      margin-top: 0.5rem;
      display: inline-block;
    }

    .btn-link:hover {
      color: #c4b5fd;
    }

    /* Footer */
    .footer-bar {
      width: 100%;
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.75rem;
      color: #475569;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .footer-bar a {
      color: #64748b;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    .footer-bar a:hover {
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      .status-card {
        padding: 2rem 1.25rem;
        border-radius: 24px;
      }
      .status-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header-bar">
    <a href="/meeting/profiles" class="brand-link">
      <span class="live-dot"></span>
      <span class="brand-logo">NearMe</span>
    </a>
    <a href="/meeting/profiles" class="nav-back-btn">
      <span>←</span>
      <span>Meeting Profiles</span>
    </a>
  </header>

  <!-- Main Status Wrapper -->
  <main class="main-wrap">
    <div id="status-card-root" class="status-card card-cancelled">
      <div class="card-content">
        <!-- Rendered via JavaScript -->
        <div class="status-icon-wrap icon-cancelled">⏳</div>
        <h1 class="status-title">Checking Payment Status...</h1>
        <p class="status-desc">Please wait while we retrieve your transaction confirmation.</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-bar">
    <span>© 2026 NearMe Services • Verified PayU Secure Gateway</span>
    <div style="margin-top: 0.4rem;">
      <a href="/meeting/">Home</a>•
      <a href="/meeting/profiles">Profiles</a>•
      <a href="https://wa.me/919183053829" target="_blank">Support</a>
    </div>
  </footer>

  <script>
    (function () {
      // 1. Parse URL Parameters
      const urlParams = new URLSearchParams(window.location.search);
      const rawStatus = (urlParams.get('status') || 'cancelled').toLowerCase();
      const txnid = urlParams.get('txnid') || 'MT_N/A';
      const amount = urlParams.get('amount') || '350';
      const mihpayid = urlParams.get('mihpayid') || '';
      const token = urlParams.get('token') || '';
      const msg = urlParams.get('msg') || urlParams.get('error_Message') || '';

      // 2. Retrieve Stored Meeting Details (from current session or persistent profile)
      const bookedGirl = sessionStorage.getItem('meeting_profile_name') || localStorage.getItem('meeting_last_profile_name') || '';
      const bookedDate = sessionStorage.getItem('meeting_booking_date') || '';
      const bookedSlot = sessionStorage.getItem('meeting_booking_slot') || '';
      const userName = localStorage.getItem('meeting_user_name') || '';
      const userPhone = localStorage.getItem('meeting_user_phone') || '';

      // Determine Canonical Status
      let status = 'cancelled';
      if (rawStatus === 'success') {
        status = 'success';
      } else if (rawStatus === 'failed' || rawStatus === 'failure' || rawStatus === 'error' || rawStatus === 'tampered') {
        status = 'failed';
      } else if (rawStatus === 'pending') {
        status = 'pending';
      } else {
        status = 'cancelled';
      }

      const cardRoot = document.getElementById('status-card-root');
      cardRoot.className = 'status-card card-' + status;

      // WhatsApp WhatsApp contact numbers & messages
      const WA_PHONE = '919183053829';

      let html = '';

      if (status === 'success') {
        const waSuccessMsg = encodeURIComponent(
          `*FAST MEETING BOOKING CONFIRMED (PayU ₹${amount})*\n` +
          `-----------------------------------\n` +
          `• Order ID: ${txnid}\n` +
          (bookedGirl ? `• Profile: ${bookedGirl}\n` : '') +
          (bookedDate ? `• Date: ${bookedDate}\n` : '') +
          (bookedSlot ? `• Slot: ${bookedSlot}\n` : '') +
          (userName ? `• Client Name: ${userName}\n` : '') +
          (userPhone ? `• Phone: ${userPhone}\n` : '') +
          `• PayU MihpayID: ${mihpayid}\n` +
          `• Advance Paid: ₹${amount}\n` +
          `-----------------------------------\n` +
          `Please share the direct WhatsApp/phone number & meeting address location right away!`
        );

        html = `
          <div class="card-content">
            <div class="status-icon-wrap icon-success">✓</div>
            <div class="status-badge badge-success">● Verified via PayU</div>
            <h1 class="status-title">Booking Confirmed! 🎉</h1>
            <p class="status-desc">
              Your ₹${amount} advance booking ${bookedGirl ? `with <strong style="color:#f59e0b">${bookedGirl}</strong>` : ''} has been successfully verified! Contact details & meeting address are ready.
            </p>

            <div class="details-box">
              <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-val" style="font-family: monospace;">${txnid}</span>
              </div>
              ${bookedGirl ? `
              <div class="detail-row">
                <span class="detail-label">Booked Profile</span>
                <span class="detail-val val-highlight">🌸 ${bookedGirl}</span>
              </div>` : ''}
              <div class="detail-row">
                <span class="detail-label">Advance Paid</span>
                <span class="detail-val" style="color: #34d399;">₹${amount}</span>
              </div>
              ${bookedDate || bookedSlot ? `
              <div class="detail-row">
                <span class="detail-label">Booking Time</span>
                <span class="detail-val">${bookedDate || 'Today'} • ${bookedSlot || 'Evening'}</span>
              </div>` : ''}
              ${userName ? `
              <div class="detail-row">
                <span class="detail-label">Client Name</span>
                <span class="detail-val">${userName}</span>
              </div>` : ''}
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-val" style="color: #34d399;">Active & Confirmed</span>
              </div>
            </div>

            <div class="actions-stack">
              <a href="https://wa.me/${WA_PHONE}?text=${waSuccessMsg}" target="_blank" class="btn-main btn-whatsapp">
                <span>💬</span>
                <span>Get Number & Location on WhatsApp</span>
              </a>
              <a href="/meeting/profiles" class="btn-main btn-outline">
                <span>↻</span>
                <span>Browse More Profiles</span>
              </a>
              <a href="/meeting/" class="btn-link">← NearMe Home</a>
            </div>
          </div>
        `;
      } else if (status === 'cancelled') {
        const waCancelMsg = encodeURIComponent(
          `*MEETING BOOKING INQUIRY (CANCELLED)*\n` +
          `-----------------------------------\n` +
          `• Order ID: ${txnid}\n` +
          (bookedGirl ? `• Profile: ${bookedGirl}\n` : '') +
          `I cancelled online PayU payment. Can I book directly by client via WhatsApp?`
        );

        html = `
          <div class="card-content">
            <div class="status-icon-wrap icon-cancelled">⚠️</div>
            <div class="status-badge badge-cancelled">● Payment Cancelled</div>
            <h1 class="status-title">Payment Cancelled</h1>
            <p class="status-desc">
              You cancelled the payment in the PayU gateway. No money was deducted from your account or bank.
            </p>

            <div class="details-box">
              <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-val" style="font-family: monospace;">${txnid}</span>
              </div>
              ${bookedGirl ? `
              <div class="detail-row">
                <span class="detail-label">Selected Profile</span>
                <span class="detail-val val-highlight">🌸 ${bookedGirl}</span>
              </div>` : ''}
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-val" style="color: #fbbf24;">Cancelled by User</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Amount Deducted</span>
                <span class="detail-val">₹0</span>
              </div>
            </div>

            <div class="actions-stack">
              <a href="/meeting/profiles" class="btn-main btn-amber">
                <span>⚡</span>
                <span>Try Fast Booking Again</span>
              </a>
              <a href="https://wa.me/${WA_PHONE}?text=${waCancelMsg}" target="_blank" class="btn-main btn-whatsapp">
                <span>💬</span>
                <span>Book by Client via WhatsApp</span>
              </a>
              <a href="/meeting/" class="btn-link">← Return to NearMe Home</a>
            </div>
          </div>
        `;
      } else if (status === 'failed') {
        const errorClean = msg || 'Transaction declined by bank or UPI app.';
        const waFailMsg = encodeURIComponent(
          `*MEETING BOOKING PAYMENT FAILED*\n` +
          `-----------------------------------\n` +
          `• Order ID: ${txnid}\n` +
          (bookedGirl ? `• Profile: ${bookedGirl}\n` : '') +
          `• Reason: ${errorClean}\n` +
          `Please assist me in booking.`
        );

        html = `
          <div class="card-content">
            <div class="status-icon-wrap icon-failed">✕</div>
            <div class="status-badge badge-failed">● Payment Failed</div>
            <h1 class="status-title">Payment Failed</h1>
            <p class="status-desc">
              Your payment could not be completed. Your bank or UPI app declined the transaction.
            </p>

            <div class="details-box">
              <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-val" style="font-family: monospace;">${txnid}</span>
              </div>
              ${bookedGirl ? `
              <div class="detail-row">
                <span class="detail-label">Selected Profile</span>
                <span class="detail-val val-highlight">🌸 ${bookedGirl}</span>
              </div>` : ''}
              <div class="detail-row">
                <span class="detail-label">Failure Reason</span>
                <span class="detail-val" style="color: #fb7185;">${errorClean}</span>
              </div>
            </div>

            <div class="actions-stack">
              <a href="/meeting/profiles" class="btn-main btn-amber">
                <span>↻</span>
                <span>Retry Booking / Choose Profile</span>
              </a>
              <a href="https://wa.me/${WA_PHONE}?text=${waFailMsg}" target="_blank" class="btn-main btn-whatsapp">
                <span>💬</span>
                <span>Get Help via WhatsApp</span>
              </a>
              <a href="/meeting/" class="btn-link">← Return to NearMe Home</a>
            </div>
          </div>
        `;
      } else {
        html = `
          <div class="card-content">
            <div class="status-icon-wrap icon-pending">⏳</div>
            <div class="status-badge badge-pending">● Processing</div>
            <h1 class="status-title">Payment Pending</h1>
            <p class="status-desc">
              PayU is confirming the payment status with your bank. If money was deducted, your booking will be confirmed shortly.
            </p>

            <div class="details-box">
              <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-val" style="font-family: monospace;">${txnid}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-val" style="color: #60a5fa;">Pending Verification</span>
              </div>
            </div>

            <div class="actions-stack">
              <button type="button" onclick="window.location.reload()" class="btn-main btn-amber">
                <span>↻</span>
                <span>Refresh Status</span>
              </button>
              <a href="https://wa.me/${WA_PHONE}?text=${encodeURIComponent('Checking status for Order ID: ' + txnid)}" target="_blank" class="btn-main btn-whatsapp">
                <span>💬</span>
                <span>Check via WhatsApp</span>
              </a>
              <a href="/meeting/profiles" class="btn-link">← Return to Profiles</a>
            </div>
          </div>
        `;
      }

      cardRoot.innerHTML = html;
    })();
  </script>
</body>
</html>
